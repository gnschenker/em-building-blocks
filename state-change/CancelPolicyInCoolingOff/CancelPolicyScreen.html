<!doctype html>
<meta charset="utf-8">
<title>Cancel policy</title>
<h1>Cancel policy</h1>
<!-- These values come from the neighbouring "Policy details" state view (not part of this slice). -->
<p>Policy <b id="policyNumber"></b>, issued <span id="issuedAt"></span></p>
<p>Cooling-off ends on <span id="coolingOffEndsAt"></span></p>
<form id="cancel">
  <label>Reason (optional) <input name="reason"></label>
  <button style="background:#1e6fd9;color:#fff">Cancel my policy</button>
</form>
<p id="result"></p>
<script type="module">
  const params = new URLSearchParams(location.search);
  for (const id of ['policyNumber', 'issuedAt', 'coolingOffEndsAt']) {
    document.getElementById(id).textContent = params.get(id) ?? '';
  }
  document.getElementById('cancel').onsubmit = async (e) => {
    e.preventDefault();
    const res = await fetch('/commands/cancel-policy-in-cooling-off', {
      method: 'POST',
      body: JSON.stringify({
        policyId: params.get('policyId'),
        reason: e.target.reason.value,
        coolingOffEndsAt: params.get('coolingOffEndsAt'), // the deadline this screen showed
      }),
    });
    const body = await res.json();
    document.getElementById('result').textContent = res.ok ? `Cancellation requested at ${body.requestedAt}` : body.error;
  };
</script>
